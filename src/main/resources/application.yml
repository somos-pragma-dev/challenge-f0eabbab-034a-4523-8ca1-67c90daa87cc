server:
  port: 8080

spring:
  application:
    name: core-integration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
    consumer:
      group-id: core-integration-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        isolation.level: read_committed
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

camel:
  spring:
    java-routes-exclude-pattern: "*"
  kafka:
    component:
     brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  route:
    event:
      input-topic: core-transactions
      output-topic: core-transactions-processed
      dlq-topic: core-transactions-dlq

integration:
  idempotency:
    enabled: true
    ttl-hours: 24
    key-prefix: "IDEM"
  retry:
    max-attempts: 3
    initial-interval-ms: 1000
    multiplier: 2.0
    max-interval-ms: 10000
  circuit-breaker:
    enabled: true
    failure-rate-threshold: 50
    wait-duration-in-open-state-ms: 30000
    sliding-window-size: 10
    permitted-number-of-calls-in-half-open-state: 3
  core-banking:
    base-url: ${CORE_BANKING_BASE_URL:http://localhost:8081}
    timeout-ms: 5000
    connection-pool-size: 10

resilience4j:
  circuitbreaker:
    instances:
      coreBanking:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
        recordExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.client.ResourceAccessException
  retry:
    instances:
      coreBanking:
        maxAttempts: 3
        waitDuration: 2s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException

logging:
  level:
    root: INFO
    com.banco.core: DEBUG
    org.apache.camel: INFO
    org.springframework.kafka: WARN
    io.github.resilience4j: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,camelroutes
  endpoint:
    health:
      show-details: always
  health:
    camel:
      enabled: true
    kafka:
      enabled: true