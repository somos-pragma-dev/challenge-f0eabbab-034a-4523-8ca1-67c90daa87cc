spring:
  application:
    name: fintech-integration-service
  main:
    web-application-type: reactive

camel:
  springboot:
    name: fintech-integration-camel
    tracing: false
  component:
    kafka:
      brokers: ${KAFKA_BROKERS:localhost:9092}
      consumer:
        auto-commit-enable: false
        max-poll-records: 100
      producer:
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: org.apache.kafka.common.serialization.StringSerializer

kafka:
  bootstrap:
    servers: ${KAFKA_BROKERS:localhost:9092}
  topics:
    events: fintech.events.novedades
    dead-letter: fintech.events.novedades.dlq
  consumer:
    group-id: fintech-integration-consumer
    auto-offset-reset: earliest
    enable-auto-commit: false
    properties:
      max.poll.interval.ms: 300000
      session.timeout.ms: 45000

retry:
  max-attempts: 3
  initial-interval-ms: 5000
  multiplier: 1.5
  max-interval-ms: 60000

processing:
  max-latency-ms: 500
  batch-size: 50
  concurrency: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    enable:
      all: true

logging:
  level:
    root: INFO
    com.fintech.integration: DEBUG
    org.apache.camel: INFO

resilience4j:
  circuitbreaker:
    instances:
      kafkaProducer:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
  retry:
    instances:
      kafkaProducer:
        maxAttempts: 3
        waitDuration: 5s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
  timelimiter:
    instances:
      kafkaProducer:
        timeoutDuration: 500ms
        cancelRunningFuture: true